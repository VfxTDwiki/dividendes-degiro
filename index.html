<title>Dividendes Degiro</title>
<style>
/* Registre fiscal : papier légèrement bleuté, encre bleu nuit, une seule couleur d'accent.
   Mise en page : en-tête outil -> chiffres clés -> onglets de tableaux. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5b6b79;
  --line: #d9e0e6;
  --accent: #1d5c8c;
  --accent-soft: #e3eef7;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --ok: #2e7d4f;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-num: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --ink: #e6edf3; --muted: #93a4b3; --line: #2a3744;
    --accent: #6cb0e6; --accent-soft: #1b3348; --warn: #f0b85a; --warn-soft: #3a2b12; --ok: #6fcf97;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --ink: #e6edf3; --muted: #93a4b3; --line: #2a3744;
  --accent: #6cb0e6; --accent-soft: #1b3348; --warn: #f0b85a; --warn-soft: #3a2b12; --ok: #6fcf97;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 20px; }
h1 { font-size: 1.6rem; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.1rem; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
header { display: grid; gap: 6px; }
.prive { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
.prive b { color: var(--ok); font-weight: 600; }

/* Barre d'outils */
.outils { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.depot { flex: 1 1 360px; border: 1.5px dashed var(--line); border-radius: 10px; background: var(--surface);
  padding: 14px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; }
.depot.survol { border-color: var(--accent); background: var(--accent-soft); }
.depot input { display: none; }
.depot .bouton { white-space: nowrap; }
.reglages { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
label { font-size: .85rem; color: var(--muted); display: grid; gap: 2px; }
select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.bouton { font: inherit; font-size: .9rem; font-weight: 500; color: var(--accent); background: var(--accent-soft);
  border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.bouton:hover { border-color: var(--accent); }
.bouton:focus-visible, select:focus-visible, .onglet:focus-visible, .depot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.etat { font-size: .9rem; color: var(--muted); }
.etat.erreur { color: var(--warn); }
.exemple { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--warn);
  background: var(--warn-soft); border-radius: 4px; padding: 2px 8px; }

/* Chiffres clés */
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tuile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tuile .v { font-family: var(--font-num); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.tuile .l { font-size: .82rem; color: var(--muted); }
.tuile.alerte .v { color: var(--warn); }

/* Onglets */
.onglets { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.onglet { font: inherit; font-size: .92rem; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent;
  padding: 8px 12px; cursor: pointer; }
.onglet[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panneau { display: grid; gap: 12px; }
.panneau[hidden] { display: none; }
.entete-panneau { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Tableaux */
.tableau { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .8rem; background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 600; border-top: 2px solid var(--line); }
tbody tr:hover td { background: var(--accent-soft); }
.chip { display: inline-block; font-size: .75rem; border-radius: 999px; padding: 1px 8px; background: var(--warn-soft); color: var(--warn); margin: 1px 2px 1px 0; }
.code { font-family: var(--font-num); font-size: .8rem; color: var(--muted); }
.formule { font-family: var(--font-num); font-size: .78rem; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bloc-formule { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.bloc-formule code { font-family: var(--font-num); font-size: .8rem; word-break: break-all; color: var(--ink); max-height: 6.5em; overflow: auto; }
.note { font-size: .85rem; color: var(--muted); max-width: 75ch; }
footer { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-wrap: nowrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
footer .avert { font-size: 1rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 1100px) { footer { flex-wrap: wrap; } footer .avert { white-space: normal; } }
.soutien { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; white-space: nowrap; text-decoration: none;
  color: var(--surface); background: var(--accent); border-radius: 999px; padding: 7px 16px; }
.soutien:hover { filter: brightness(1.1); }
.soutien:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.soutien[hidden] { display: none; }
.titre { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.langues { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langues[hidden] { display: none; }
.langue { font: inherit; font-size: .85rem; font-weight: 600; color: var(--muted); background: var(--surface); border: none; padding: 5px 12px; cursor: pointer; }
.langue[aria-pressed="true"] { color: var(--surface); background: var(--accent); }
.langue:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.renvois { counter-reset: renvoi; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; color: var(--muted); max-width: 90ch; }
.renvois li { counter-increment: renvoi; padding-left: 2.2em; text-indent: -2.2em; }
.renvois li::before { content: "(" counter(renvoi) ")"; display: inline-block; width: 2.2em; text-indent: 0; font-variant-numeric: tabular-nums; }
.renvois b { color: var(--ink); font-weight: 600; }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px;
  font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.vu { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 420px) { main { padding: 16px 16px 40px; } }
</style>

<body>
<main>
  <header>
    <div class="titre">
      <h1 data-t="titre">Dividendes Degiro</h1>
      <div class="langues" role="group" aria-label="Langue / Language">
        <button class="langue" data-lang="fr" lang="fr">FR</button>
        <button class="langue" data-lang="en" lang="en">EN</button>

  <section class="outils" aria-label="Fichier">
    <label class="depot" id="depot" for="fichier" tabindex="0">
      <input type="file" id="fichier" accept=".xlsx,.xlsm,.xls,.csv,.txt">
      <span class="bouton" data-t="choisir"></span>

    <div class="reglages">
      <label for="annee"><span data-t="annee"></span><select id="annee"></select></label>
      <label for="regle"><span data-t="conversion"></span><select id="regle"><option value="macro" data-t="regleMacro"></option><option value="credit" data-t="regleCredit"></option></select></label>
      <label for="sep"><span data-t="decimales"></span><select id="sep"><option value="," data-t="virgule"></option><option value="." data-t="point"></option></select></label>
      <span id="badge" class="exemple" data-t="exemple"></span>
    </div>
  </section>
  <p id="etat" class="etat" role="status"></p>

  <section class="tuiles" id="tuiles"></section>

  <nav class="onglets" role="tablist">
    <button class="onglet" role="tab" id="t-pays" aria-controls="p-pays" aria-selected="true" data-t="ongletPays"></button>
    <button class="onglet" role="tab" id="t-ste" aria-controls="p-ste" aria-selected="false" data-t="ongletSte"></button>
    <button class="onglet" role="tab" id="t-suivi" aria-controls="p-suivi" aria-selected="false" data-t="ongletSuivi"></button>
    <button class="onglet" role="tab" id="t-verif" aria-controls="p-verif" aria-selected="false" data-t="ongletVerif"></button>
    <button class="onglet" role="tab" id="t-detail" aria-controls="p-detail" aria-selected="false" data-t="ongletDetail"></button>

  <section class="panneau" id="p-pays" role="tabpanel" aria-labelledby="t-pays">
    <div class="entete-panneau"><h2 data-t="hPays"></h2><button class="bouton" data-copie="pays" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-pays"></table></div>
    <ol class="renvois" data-th="renvois"></ol>
  </section>

  <section class="panneau" id="p-ste" role="tabpanel" aria-labelledby="t-ste" hidden>
    <div class="entete-panneau"><h2 data-t="hSte"></h2><button class="bouton" data-copie="ste" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-ste"></table></div>
    <ol class="renvois" data-th="renvois"></ol>
  </section>

  <section class="panneau" id="p-suivi" role="tabpanel" aria-labelledby="t-suivi" hidden>
    <div class="bloc-formule">
      <div class="entete-panneau"><h2 data-t="hFormule"></h2><button class="bouton" id="copie-formule" data-t="copierFormule"></button></div>
      <code id="formule"></code>
      <p class="note" data-t="noteFormule"></p>
    </div>
    <div class="entete-panneau"><h2 data-t="hChrono"></h2><button class="bouton" data-copie="chrono" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-chrono"></table></div>
    <div class="entete-panneau"><h2 data-t="hMois"></h2><button class="bouton" data-copie="mois" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-mois"></table></div>
  </section>

  <section class="panneau" id="p-verif" role="tabpanel" aria-labelledby="t-verif" hidden>
    <div class="entete-panneau"><h2 data-t="hVerif"></h2><button class="bouton" data-copie="verif" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-verif"></table></div>

  <section class="panneau" id="p-detail" role="tabpanel" aria-labelledby="t-detail" hidden>
    <div class="entete-panneau"><h2 data-t="hDetail"></h2><button class="bouton" data-copie="detail" data-t="copierTableau"></button></div>
    <div class="tableau"><table id="tab-detail"></table></div>

  <footer>
    <p class="avert" data-t="avert"></p>
    <a class="soutien" id="soutien" href="#" target="_blank" rel="noopener" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M7 3v2M11 3v2"/></svg>
      <span data-t="soutien"></span>
    </a>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   Degiro -> dividendes : logique de calcul (portage de la macro VBA)
   Fonctionne dans le navigateur (window.DegiroCore) et sous Node (module).
   Aucune dépendance, aucun accès réseau.
   ===================================================================== */
(function (global) {
  "use strict";

  const BASE = "EUR";
  const TOL_SOMME = 0.015;        // équilibre d'un lot de change
  const TOL_FRAIS = 0.02;         // écart relatif toléré sur les frais Custody
  const TOL_CENTIME = 0.011;      // écart absolu toléré
  const FRAIS_FIXE_EUR = 1;       // part fixe des frais Custody
  const MAX_JOURS_RATTRAPAGE = 120;
  const TAUX_RETENUE = { JP: 0.15315, CA: 0.25, US: 0.15 };

  const T_BRUT = "Dividende brut", T_IMPOT = "Retenue à la source", T_FRAIS = "Frais Custody";

  /* ---------- utilitaires ---------- */
  function num(v) {
    if (v === null || v === undefined || v === "") return 0;
    if (typeof v === "number") return v;
    let s = String(v).trim().replace(/[\s  ]/g, "");
    s = s.replace(/\u2212/g, "-");
    if (s.indexOf(",") >= 0 && s.indexOf(".") >= 0) s = s.replace(/\./g, "");
    s = s.replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  // Jour (nombre de jours depuis 1970) à partir de "jj-mm-aaaa", "jj/mm/aaaa", Date ou série Excel
  function jour(v) {
    if (v === null || v === undefined || v === "") return NaN;
    if (v instanceof Date) return Math.floor(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 864e5);
    if (typeof v === "number") return Math.floor(v) - 25569;            // série Excel
    const m = String(v).trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
    if (m) return Math.floor(Date.UTC(+m[3], +m[2] - 1, +m[1]) / 864e5);
    const m2 = String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m2) return Math.floor(Date.UTC(+m2[1], +m2[2] - 1, +m2[3]) / 864e5);
    return NaN;
  }
  function jourVersDate(j) { return new Date(j * 864e5); }
  function fmtDate(j) {
    if (isNaN(j)) return "";
    const d = jourVersDate(j);
    return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + d.getUTCFullYear();
  }
  function annee(j) { return jourVersDate(j).getUTCFullYear(); }
  function mois(j) { return jourVersDate(j).getUTCMonth() + 1; }
  function heure(v) {
    if (typeof v === "number") { const mn = Math.round(v * 1440); return String(Math.floor(mn / 60)).padStart(2, "0") + ":" + String(mn % 60).padStart(2, "0"); }
    return v === null || v === undefined ? "" : String(v).trim();
  }
  // Arrondi commercial (0,225 -> 0,23), comme Excel ARRONDI
  function arr2(x) { const s = x < 0 ? -1 : 1; return s * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9) / 100; }
  // Arrondi "au pair" de VBA Round(x, 2) (pour retomber sur les mêmes centimes que la macro)
  function vbaRound2(x) {
    const v = x * 100, f = Math.floor(v), d = v - f;
    if (Math.abs(d - 0.5) < 1e-9) return (f % 2 === 0 ? f : f + 1) / 100;
    return Math.round(v) / 100;
  }
  function nettoyerLibelle(s) {
    s = s === null || s === undefined ? "" : String(s);
    return s.replace(/(\d)[   ](?=\d)/g, "$1").replace(/[   ]/g, " ");
  }

  /* ---------- 1. Lecture : tableau brut (1re ligne = en-têtes) -> lignes normalisées ---------- */
  function normaliser(table) {
    const h = table[0].map(x => (x === null || x === undefined ? "" : String(x)).trim().toLowerCase());
    const col = (...noms) => { for (const n of noms) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };
    const c = {
      date: col("date"), heure: col("heure", "time"), dval: col("date de", "date de valeur", "value date"),
      pdt: col("produit", "product"), isin: col("code isin", "isin"), desc: col("description"),
      fx: col("fx"), mouv: col("mouvements", "change", "mouvement"), id: col("id ordre", "order id")
    };
    if (c.date < 0 || c.desc < 0 || c.mouv < 0) throw new Error("Colonnes Date / Description / Mouvements introuvables : est-ce bien un relevé de compte Degiro ?");
    const lignes = [];
    for (let r = 1; r < table.length; r++) {
      const t = table[r];
      if (!t || t.every(v => v === null || v === undefined || v === "")) continue;
      const g = i => (i >= 0 && i < t.length ? t[i] : null);
      // Libellé coupé sur 2 lignes (ancien format) : ligne sans date -> rattachée à la précédente
      if ((g(c.date) === null || g(c.date) === "") && lignes.length) {
        const p = lignes[lignes.length - 1];
        if (g(c.id)) p.id += String(g(c.id)).trim(); else p.desc += nettoyerLibelle(g(c.desc));
        continue;
      }
      lignes.push({
        n: lignes.length, date: jour(g(c.date)), heure: heure(g(c.heure)), dval: jour(g(c.dval)),
        pdt: String(g(c.pdt) || "").trim(), isin: String(g(c.isin) || "").trim(),
        desc: nettoyerLibelle(g(c.desc)).trim(), fx: num(g(c.fx)),
        dev: String(g(c.mouv) || "").trim().toUpperCase(), mnt: num(g(c.mouv + 1)),
        id: String(g(c.id) || "").trim()
      });
    }
    return lignes;   // ordre du fichier : la plus récente en premier
  }

  /* ---------- 2. Opérations sur titres : l'historique de l'ancien ISIN passe sous le nouveau ---------- */
  const PREFIXES_OST = ["Changement ISIN", "Fractionnement", "Regroupement", "Modification instrument", "Ajustement fractionnement"];
  function prefixeOST(d) { return PREFIXES_OST.find(p => d.startsWith(p)) || ""; }
  function jambeOST(d, m) {
    if (d.indexOf(": Vente ") >= 0) return "V";
    if (d.indexOf(": Achat ") >= 0) return "A";
    if (prefixeOST(d)) return m > 0 ? "V" : m < 0 ? "A" : "";
    return "";
  }
  function appliquerOST(L) {
    const journal = [];
    for (let r = L.length - 1; r >= 0; r--) {                       // chronologique
      const p = prefixeOST(L[r].desc);
      if (!p || jambeOST(L[r].desc, L[r].mnt) !== "V") continue;
      let a = -1;
      for (let j = r - 3; j <= r + 3; j++) {
        if (j < 0 || j >= L.length || j === r) continue;
        if (prefixeOST(L[j].desc) === p && jambeOST(L[j].desc, L[j].mnt) === "A" &&
            L[j].date === L[r].date && L[j].heure === L[r].heure) { a = j; break; }
      }
      if (a < 0) continue;
      const ancien = L[r].isin, nouveau = L[a].isin, nom = L[a].pdt;
      for (const x of L) if (x.isin === ancien || x.isin === nouveau) { x.isin = nouveau; x.pdt = nom; }
      journal.push({ date: L[r].date, type: p, ancien, nouveau, nom });
    }
    return journal;
  }

  /* ---------- 3. Taux de change : rapprochement des conversions par montant (FIFO) ---------- */
  const estChange = d => /ration de change/i.test(d);
  function lotsDeChange(L) {
    const n = L.length;
    const taux = new Array(n).fill(0), lot = new Array(n).fill(""), ctrl = new Array(n).fill("");
    const lots = [];
    for (let i = 0; i < n; i++) if (L[i].dev === BASE) taux[i] = 1;
    for (let i = n - 1; i >= 0; i--) {
      const x = L[i];
      if (!estChange(x.desc) || x.dev === BASE || !x.dev || !(x.fx > 0) || x.id) continue;
      const idLot = "LOT_" + x.dev + "_" + fmtDate(x.date) + "_L" + (i + 2);
      let somme = 0, fin = -1;
      for (let j = n - 1; j > i; j--) {
        const y = L[j];
        if (estChange(y.desc) || y.dev !== x.dev || taux[j] !== 0 || y.id) continue;
        somme += y.mnt;
        if (Math.abs(arr2(somme + x.mnt)) <= TOL_SOMME) { fin = j; break; }
      }
      const ecart = fin >= 0 ? 0 : arr2(somme + x.mnt);
      const borne = fin >= 0 ? fin : i + 1;
      const membres = [];
      for (let j = n - 1; j >= borne; j--) {
        const y = L[j];
        if (estChange(y.desc) || y.dev !== x.dev || taux[j] !== 0 || y.id) continue;
        taux[j] = x.fx; lot[j] = idLot; membres.push(j);
        if (ecart) ctrl[j] = "Écart lot de change " + ecart.toFixed(2).replace(".", ",") + " " + x.dev;
      }
      taux[i] = x.fx; lot[i] = idLot;
      let eur = 0;
      for (const k of [i - 1, i + 1]) {
        if (k >= 0 && k < n && estChange(L[k].desc) && L[k].dev === BASE && L[k].date === x.date && L[k].heure === x.heure) {
          lot[k] = idLot; eur = L[k].mnt; break;
        }
      }
      lots.push({ id: idLot, dev: x.dev, date: x.date, montant: x.mnt, taux: x.fx, eur, membres, ecart });
    }
    for (let i = 0; i < n; i++) {
      const x = L[i];
      if (!taux[i] && x.dev && x.dev !== BASE && !estChange(x.desc) && !x.id && Math.abs(x.mnt) >= 0.005)
        ctrl[i] = "Pas de conversion trouvée (exporter l'historique jusqu'à mi-janvier N+1 ?)";
    }
    return { taux, lot, ctrl, lots };
  }

  /* ---------- 4. Dividendes : rattachement des retenues et des frais ---------- */
  function tauxRetenue(isin) { return TAUX_RETENUE[(isin || "").slice(0, 2).toUpperCase()] || 0; }
  function fraisTheo(net, tauxDev) {
    if (net <= 0) return 0;
    const a = 0.1 * net, b = tauxDev > 0 ? 0.03 * net + FRAIS_FIXE_EUR * tauxDev : a;
    return arr2(Math.min(a, b));
  }
  const estDividende = d => d === "Dividende" || d === "Remboursement de capital";
  const estImpot = d => /^imp/i.test(d) && /dividende/i.test(d);
  const estFrais = (d, isin) => /^frais d/i.test(d) && /titres/i.test(d) && !isin;

  function dividendes(L, fx) {
    const n = L.length, taux = fx.taux;
    const F = [], ficheDe = new Array(n).fill(-1), tagDe = new Array(n).fill(""), tauxUtil = new Array(n).fill(0);
    const ctrl = fx.ctrl.slice();
    const cles = new Map();
    const cle = x => x.isin + "|" + x.date + "|" + x.heure;

    for (let i = n - 1; i >= 0; i--) {
      const x = L[i];
      if (!estDividende(x.desc)) continue;
      const f = {
        k: F.length, ligne: i, ligneMax: i, ste: x.pdt, isin: x.isin, dev: x.dev, dval: x.dval, date: x.date,
        type: x.desc, brut: x.mnt, impot: 0, impotCorr: 0, impotCorrEur: 0, impotCorrEurM: 0, frais: 0, fraisRat: 0, fraisRatEur: 0, fraisEurM: 0,
        taux: taux[i], aFrais: false, aImpot: false, ctrl: [], lignes: [i]
      };
      if (ctrl[i]) f.ctrl.push(ctrl[i]);
      if (x.desc === "Remboursement de capital") f.ctrl.push("Remboursement de capital : traité comme dividende brut (à vérifier fiscalement)");
      ficheDe[i] = f.k; tagDe[i] = T_BRUT; tauxUtil[i] = f.taux;
      if (!cles.has(cle(x))) cles.set(cle(x), f.k);
      F.push(f);
    }
    const dj = (a, b) => b - a;

    // --- retenues : 4 passes ---
    for (let passe = 1; passe <= 4; passe++) {
      for (let i = n - 1; i >= 0; i--) {
        const x = L[i];
        if (!estImpot(x.desc) || ficheDe[i] >= 0) continue;
        let r = -1;
        if (passe === 1) {
          let best = Infinity;
          for (const f of F) {
            if (f.aImpot || f.dev !== x.dev || f.brut <= 0 || Math.abs(dj(f.dval, x.dval)) > 3) continue;
            const tr = tauxRetenue(f.isin);
            if (!tr) continue;
            if (Math.abs(arr2(f.brut * tr) + x.mnt) <= TOL_CENTIME) {
              const sc = Math.abs(f.ligne - i) + (f.isin !== x.isin ? 1e6 : 0);
              if (sc < best) { best = sc; r = f.k; }
            }
          }
          if (r >= 0 && F[r].isin !== x.isin) ctrl[i] = "Retenue réattribuée par calcul (ISIN de la ligne : " + x.isin + ")";
        } else if (passe === 2) {
          if (cles.has(cle(x)) && !F[cles.get(cle(x))].aImpot) r = cles.get(cle(x));
        } else if (passe === 3) {
          const f = F.find(f => !f.aImpot && f.isin === x.isin && f.dev === x.dev && f.dval === x.dval);
          if (f) r = f.k;
        } else {
          for (const f of F) {
            if (f.isin !== x.isin || f.dev !== x.dev || f.dval > x.dval) continue;
            if (r < 0 || f.dval > F[r].dval) r = f.k;
            if (f.dval === x.dval) { r = f.k; break; }
          }
        }
        if (r < 0) continue;
        const f = F[r];
        ficheDe[i] = r; tagDe[i] = T_IMPOT; f.lignes.push(i); f.impot += x.mnt;
        if (passe === 4) {
          f.impotCorr += x.mnt;
          tauxUtil[i] = taux[i] || f.taux;
          if (tauxUtil[i]) { f.impotCorrEur += arr2(x.mnt / tauxUtil[i]); f.impotCorrEurM += vbaRound2(x.mnt / tauxUtil[i]); }
          ctrl[i] = "Correction d'impôt du dividende du " + fmtDate(f.dval);
          f.ctrl.push("Correction d'impôt " + x.mnt.toFixed(2).replace(".", ",") + " le " + fmtDate(x.date));
        } else {
          f.aImpot = true; tauxUtil[i] = f.taux;
          if (i > f.ligneMax) f.ligneMax = i;
          if (taux[i] !== f.taux) f.ctrl.push("Taux de la retenue différent");
          const tr = tauxRetenue(f.isin);
          if (passe > 1 && tr && Math.abs(arr2(f.brut * tr) + x.mnt) > TOL_CENTIME)
            f.ctrl.push("Retenue " + (-x.mnt / f.brut * 100).toFixed(3).replace(".", ",") + " % au lieu de " + (tr * 100).toFixed(3).replace(".", ",") + " %");
        }
      }
    }

    // taux approché par devise (pour les frais théoriques d'une ligne non convertie)
    const fxApprox = {};
    for (const x of L) if (estChange(x.desc) && x.dev !== BASE && x.fx > 0 && !(x.dev in fxApprox) && !x.id) fxApprox[x.dev] = x.fx;
    fxApprox[BASE] = 1;

    // --- frais Custody : 3 passes ---
    for (let passe = 1; passe <= 3; passe++) {
      for (let i = n - 1; i >= 0; i--) {
        const x = L[i];
        if (!estFrais(x.desc, x.isin) || ficheDe[i] >= 0) continue;
        const mF = -x.mnt;
        let r = -1, best = Infinity;
        if (passe <= 2) {
          for (const f of F) {
            if (f.aFrais || f.dev !== x.dev) continue;
            const e = dj(f.dval, x.dval);
            if (!((passe === 1 && e === 0) || (passe === 2 && e > 0 && e <= MAX_JOURS_RATTRAPAGE))) continue;
            const t = f.taux || fxApprox[f.dev] || 0;
            // net de retenue hors corrections ultérieures ; dividende annulé (net < 0) : frais remboursés
            const netF = f.brut + f.impot - f.impotCorr, sg = netF < 0 ? -1 : 1;
            const th = fraisTheo(sg * netF, t);
            if (th <= 0) continue;
            const er = Math.abs(sg * mF - th) <= TOL_CENTIME ? 0 : Math.abs(sg * mF - th) / th;
            if (er > TOL_FRAIS) continue;
            const sc = Math.floor(er / 0.005) * 1e6 + (passe === 1 ? Math.abs(f.ligne - i) : e);
            if (sc < best) { best = sc; r = f.k; }
          }
        } else {
          for (let j = i + 1; j <= Math.min(i + 3, n - 1); j++) {
            if (ficheDe[j] >= 0 && tagDe[j] !== T_FRAIS && !F[ficheDe[j]].aFrais && L[j].date === x.date) {
              r = ficheDe[j]; F[r].ctrl.push("Frais rattachés par position (formule non vérifiée)"); break;
            }
          }
        }
        if (r < 0) continue;
        const f = F[r];
        ficheDe[i] = r; tagDe[i] = T_FRAIS; f.lignes.push(i); f.frais += x.mnt; f.aFrais = true;
        if (passe === 2) {
          // rattrapage : converti au taux de SA propre conversion
          tauxUtil[i] = taux[i] || f.taux;
          f.fraisRat += x.mnt;
          if (tauxUtil[i]) f.fraisRatEur += arr2(x.mnt / tauxUtil[i]);
          ctrl[i] = "Rattrapage de frais du dividende du " + fmtDate(f.dval);
          f.ctrl.push("Frais rattrapés le " + fmtDate(x.date));
        } else {
          tauxUtil[i] = f.taux;
          if (i > f.ligneMax) f.ligneMax = i;
        }
        if (tauxUtil[i]) f.fraisEurM += vbaRound2(x.mnt / tauxUtil[i]);   // règle macro : frais ligne à ligne
      }
    }

    // --- montants nets : deux règles de conversion en euros ---
    //  "macro"  : brut, retenue et frais convertis séparément puis additionnés (macro Excel)
    //  "credit" : net du dividende converti en une fois au taux de son lot (= crédit EUR de
    //             Degiro quand le lot ne contient qu'un dividende) ; brut EUR par différence
    //  Dans les deux cas, corrections d'impôt et rattrapages de frais sont convertis à leur propre taux.
    for (const f of F) {
      f.net = arr2(f.brut + f.impot + f.frais);
      if (f.taux > 0) {
        const impotLot = f.impot - f.impotCorr, fraisLot = f.frais - f.fraisRat;
        const bM = vbaRound2(f.brut / f.taux), iM = vbaRound2(impotLot / f.taux) + f.impotCorrEurM;
        f.macro = { brutEur: bM, impotEur: arr2(iM), fraisEur: arr2(f.fraisEurM), netEur: arr2(bM + iM + f.fraisEurM) };
        const netC = arr2(arr2((f.brut + impotLot + fraisLot) / f.taux) + f.impotCorrEur + f.fraisRatEur);
        const iC = arr2(arr2(impotLot / f.taux) + f.impotCorrEur), frC = arr2(arr2(fraisLot / f.taux) + f.fraisRatEur);
        f.credit = { brutEur: arr2(netC - iC - frC), impotEur: iC, fraisEur: frC, netEur: netC };
      } else {
        f.macro = f.credit = { brutEur: 0, impotEur: 0, fraisEur: 0, netEur: 0 };
        f.ctrl.push("Taux de change inconnu");
      }
      Object.assign(f, { brutEur: f.macro.brutEur, impotEur: f.macro.impotEur, fraisEurAff: f.macro.fraisEur, netEur: f.macro.netEur });
      { const nf = f.brut + f.impot - f.impotCorr, sg = nf < 0 ? -1 : 1;
        f.theo = f.frais ? -sg * fraisTheo(sg * nf, f.taux || fxApprox[f.dev] || 0) : 0; }
      f.pays = /^BMG/i.test(f.isin) ? "HK" : (f.isin || "").slice(0, 2).toUpperCase();   // BMG : Bermudes cotées à Hong Kong
    }

    // lignes orphelines
    const orphelins = [];
    for (let i = 0; i < n; i++) {
      const x = L[i];
      if (estImpot(x.desc) && ficheDe[i] < 0) orphelins.push({ i, motif: "Retenue sans dividende" });
      else if (estFrais(x.desc, x.isin) && ficheDe[i] < 0) orphelins.push({ i, motif: "Frais sans dividende (dividende hors période exportée ?)" });
    }
    return { fiches: F, ficheDe, tagDe, tauxUtil, ctrl, orphelins };
  }

  /* ---------- 5. Synthèses ---------- */
  function nomsCourts(stes, imposes) {
    const premiers = {};
    for (const s of stes) { const w = s.split(/\s+/)[0].toUpperCase(); premiers[w] = (premiers[w] || 0) + 1; }
    const propre = s => s.toLowerCase().replace(/(^|[\s\-'&.(])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
    const res = {};
    for (const s of stes) {
      if (imposes && imposes[s.toUpperCase()]) { res[s] = imposes[s.toUpperCase()]; continue; }
      const mots = s.split(/\s+/);
      res[s] = propre(premiers[mots[0].toUpperCase()] > 1 && mots.length > 1 ? mots[0] + " " + mots[1] : mots[0]);
    }
    return res;
  }

  function terme(x, libelle, premier, sepDec) {
    let s = Math.abs(arr2(x)).toString().replace(".", sepDec);
    s = x < 0 ? "-" + s : premier ? s : "+" + s;
    return s + '+N("' + libelle + '")';
  }

  function synthese(L, res, an, options) {
    options = options || {};
    const sep = options.sepDec || ",";
    const regle = options.regle === "credit" ? "credit" : "macro";
    for (const f of res.fiches) {
      const m = f[regle];
      f.brutEur = m.brutEur; f.impotEur = m.impotEur; f.fraisEurAff = m.fraisEur; f.netEur = m.netEur;
    }
    const F = res.fiches.filter(f => annee(f.date) === an);
    F.sort((a, b) => a.date - b.date || a.ste.localeCompare(b.ste));
    const courts = nomsCourts([...new Set(F.map(f => f.ste))], options.nomsImposes);

    // par société (même logique que DIVID_SYNTH : taux moyen = net devise / net EUR)
    const parSte = new Map();
    for (const f of F) {
      if (!parSte.has(f.ste)) parSte.set(f.ste, { ste: f.ste, court: courts[f.ste], isin: f.isin, pays: f.pays, dev: f.dev, brut: 0, impot: 0, frais: 0, net: 0, netEur: 0, n: 0, ctrl: [] });
      const s = parSte.get(f.ste);
      s.brut += f.brut; s.impot += f.impot; s.frais += f.frais; s.net += f.net; s.netEur += f.netEur; s.n++;
      if (f.ctrl.length) s.ctrl.push(...f.ctrl);
    }
    const societes = [...parSte.values()].sort((a, b) => a.ste.localeCompare(b.ste));
    for (const s of societes) {
      s.netEur = arr2(s.netEur);
      if (s.dev === BASE) { s.L = 1; s.netEur = arr2(s.brut + s.impot + s.frais); }
      else s.L = s.netEur ? s.net / s.netEur : 0;
      s.impotEur = s.L ? arr2(s.impot / s.L) : 0;
      s.fraisEur = s.L ? arr2(s.frais / s.L) : 0;
      s.netEurR = s.L ? arr2(s.net / s.L) : 0;
      s.brutEur = arr2(s.netEurR - s.fraisEur - s.impotEur);
      s.pctRetenue = s.brut ? -s.impot / s.brut : 0;
    }

    // par pays
    const parPays = new Map();
    for (const s of societes) {
      if (!parPays.has(s.pays)) parPays.set(s.pays, { pays: s.pays, brutEur: 0, impotEur: 0, fraisEur: 0, netAvantFrais: 0, netEur: 0, societes: 0 });
      const p = parPays.get(s.pays);
      p.brutEur += s.brutEur; p.impotEur += s.impotEur; p.fraisEur += s.fraisEur; p.netEur += s.netEurR; p.societes++;
    }
    const pays = [...parPays.values()].map(p => {
      for (const k of ["brutEur", "impotEur", "fraisEur", "netEur"]) p[k] = arr2(p[k]);
      p.netAvantFrais = arr2(p.brutEur + p.impotEur);
      return p;
    }).sort((a, b) => a.pays.localeCompare(b.pays));

    // suivi chronologique + formules
    const chrono = F.map(f => ({ date: f.date, mois: String(mois(f.date)).padStart(2, "0") + "/" + String(annee(f.date)).slice(2), ste: f.ste, court: courts[f.ste], netEur: f.netEur }));
    let formule = "";
    chrono.forEach((c, i) => { formule += terme(c.netEur, c.court + " " + c.mois, i === 0, sep); });
    let suite = "";
    for (let i = chrono.length - 1; i >= 0; i--) {
      suite = terme(chrono[i].netEur, chrono[i].court + " " + chrono[i].mois, false, sep) + suite;
      chrono[i].suite = suite;
    }
    for (const s of societes) {
      let fs = "", premier = true;
      s.mois = new Array(12).fill(0);
      for (const c of chrono) if (c.ste === s.ste) {
        s.mois[mois(c.date) - 1] += c.netEur;
        fs += terme(c.netEur, c.court + " " + c.mois, premier, sep); premier = false;
      }
      s.mois = s.mois.map(arr2);
      s.formule = "=" + fs;
    }
    return { an, fiches: F, societes, pays, chrono, formule: "=" + formule,
             total: arr2(F.reduce((a, f) => a + f.netEur, 0)) };
  }

  function analyser(table) {
    const L = normaliser(table);
    const ost = appliquerOST(L);
    const fx = lotsDeChange(L);
    const res = dividendes(L, fx);
    const annees = [...new Set(res.fiches.map(f => annee(f.date)))].sort();
    return { lignes: L, ost, fx, res, annees };
  }

  const api = { analyser, synthese, normaliser, appliquerOST, lotsDeChange, dividendes, fmtDate, annee, arr2, vbaRound2, TAUX_RETENUE };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else global.DegiroCore = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>

/* Construit un tableau HTML + sa version TSV (pour copier vers Excel / Sheets) */
function rendre(id, cols, lignes, total) {
  const th = cols.map(c => `<th class="${c.n ? "n" : ""}">${esc(c.t)}</th>`).join("");
  const td = (c, l) => {
    const v = c.v(l);
    const html = c.html ? c.html(l) : (c.n ? (typeof v === "number" ? (c.f || eur)(v, l) : "") : esc(v ?? ""));
    return `<td class="${c.n ? "n" : ""}">${html}</td>`;
  };
  let corps = lignes.map(l => "<tr>" + cols.map(c => td(c, l)).join("") + "</tr>").join("");
  if (total) corps += `<tr class="total">` + cols.map(c => td(c, total)).join("") + "</tr>";
  $(id).innerHTML = `<thead><tr>${th}</tr></thead><tbody>${corps}</tbody>`;
  const val = (c, l) => { const v = c.v(l); return typeof v === "number" ? String(Math.round(v * 1e4) / 1e4).replace(".", TXT[lang].decTsv) : String(v ?? "").replace(/\s+/g, " "); };
  return [cols.map(c => c.t).join("\t"), ...lignes.map(l => cols.map(c => val(c, l)).join("\t")), ...(total ? [cols.map(c => val(c, total)).join("\t")] : [])].join("\n");
}

function charger(table, nom, exemple) {
  try {
    analyse = C.analyser(table);
  } catch (e) {
    $("etat").textContent = t("erreur", { m: motif(e.message) });
    $("etat").classList.add("erreur");
    return;
  }
  $("etat").classList.remove("erreur");
  nomFichier = nom; estExemple = exemple;
  const ans = analyse.annees.slice().reverse();
  const actuel = +$("annee").value;
  $("annee").innerHTML = ans.map(a => `<option>${a}</option>`).join("");
  const complet = ans.filter(a => a < new Date().getFullYear());
  $("annee").value = ans.includes(actuel) && !exemple ? actuel : (complet[0] || ans[0]);
  $("badge").hidden = !exemple;
  afficher();
}

/* ---------- lecture .xlsx sans bibliothèque (zip + XML) ---------- */
async function dezipper(buf) {
  const v = new DataView(buf), u8 = new Uint8Array(buf), fichiers = {};
  let e = buf.byteLength - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("ce fichier n'est pas un classeur .xlsx");
  const nb = v.getUint16(e + 10, true);
  let p = v.getUint32(e + 16, true);
  const dec = new TextDecoder();
  for (let k = 0; k < nb; k++) {
    if (v.getUint32(p, true) !== 0x02014b50) break;
    const flags = v.getUint16(p + 8, true), meth = v.getUint16(p + 10, true), taille = v.getUint32(p + 20, true);
    const ln = v.getUint16(p + 28, true), lx = v.getUint16(p + 30, true), lc = v.getUint16(p + 32, true);

  const lire = async nom => {
    const f = fichiers[nom.replace(/^\//, "").toLowerCase()];

    const brut = u8.subarray(d, d + f.taille);

/* éléments XML par nom local, quel que soit le préfixe d'espace de noms (x:row, row…) */
const enfants = (n, nom) => [...n.getElementsByTagNameNS("*", nom)];
const xmlDoc = s => new DOMParser().parseFromString(s, "application/xml");
const colIndex = ref => { let n = 0; for (const ch of ref.replace(/[^A-Z]/gi, "").toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
function lireFeuilleXml(texte, partages) {
  const table = [];
  for (const row of enfants(xmlDoc(texte), "row")) {
    const ligne = []; let pos = 0;
    for (const c of enfants(row, "c")) {
      const r = c.getAttribute("r"), t = c.getAttribute("t"), vEl = enfants(c, "v")[0];
      const i = r ? colIndex(r) : pos; pos = i + 1;
      let val = null;
      if (t === "s") val = vEl ? partages[+vEl.textContent] ?? null : null;
      else if (t === "inlineStr") val = enfants(c, "t").map(x => x.textContent).join("");
      else if (t === "str" || t === "e") val = vEl ? vEl.textContent : null;
      else if (t === "b") val = vEl ? vEl.textContent === "1" : null;
      else if (vEl && vEl.textContent !== "") { const n = Number(vEl.textContent); val = isNaN(n) ? vEl.textContent : n; }
      ligne[i] = val;
    }
    for (let i = 0; i < ligne.length; i++) if (ligne[i] === undefined) ligne[i] = null;
    const nr = +row.getAttribute("r");
    if (nr > 0) table[nr - 1] = ligne; else table.push(ligne);
  }
  return table.filter(Boolean);
}
/* repère la ligne d'en-têtes du relevé (peut être précédée de lignes de titre) */
function ligneEntete(table) {
  for (let r = 0; r < Math.min(table.length, 40); r++) {
    const h = (table[r] || []).map(x => String(x ?? "").trim().toLowerCase());
    if (h.includes("description") && (h.includes("date") || h.includes("mouvements") || h.includes("change"))) return r;
  }
  return -1;
}
async function lireXlsx(buf) {
  const lire = await dezipper(buf);
  const partages = [];
  const ss = await lire("xl/sharedStrings.xml");
  if (ss) for (const si of enfants(xmlDoc(ss), "si"))
    partages.push(enfants(si, "t").filter(t => !t.closest || !(t.parentNode && t.parentNode.localName === "rPh")).map(t => t.textContent).join(""));
  // feuilles dans l'ordre du classeur, puis toutes les autres
  const chemins = [];
  const wb = await lire("xl/workbook.xml"), rels = await lire("xl/_rels/workbook.xml.rels");
  if (wb && rels) {
    const cibles = {};
    for (const r of enfants(xmlDoc(rels), "Relationship")) cibles[r.getAttribute("Id")] = r.getAttribute("Target");
    for (const s of enfants(xmlDoc(wb), "sheet")) {
      const rid = [...s.attributes].find(a => a.localName === "id" && a.name !== "sheetId");
      const t = rid && cibles[rid.value];
      if (t) chemins.push(t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, ""));
    }
  }
  for (const n of lire.noms) if (/^xl\/worksheets\/[^/]+\.xml$/.test(n) && !chemins.some(c => c.toLowerCase() === n)) chemins.push(n);
  if (!chemins.length) throw new Error("aucune feuille trouvée dans le classeur");
  let premiere = null;
  for (const ch of chemins) {
    const x = await lire(ch);
    if (!x) continue;
    const table = lireFeuilleXml(x, partages);
    if (!premiere) premiere = table;
    if (ligneEntete(table) >= 0) return table;
  }
  return premiere || [];
}
/* ancien format .xls : soit un vrai classeur Excel 97-2003, soit une page HTML renommée */
function lireHtml(texte) {
  const doc = new DOMParser().parseFromString(texte, "text/html");
  const tables = [...doc.querySelectorAll("table")].map(t => [...t.rows].map(r => [...r.cells].map(c => { const s = c.textContent.trim(); return s === "" ? null : s; })));
  return tables.find(t => ligneEntete(t) >= 0) || tables[0] || [];
}
function lireCsv(texte) {
  texte = texte.replace(/^﻿/, "");
  const premiere = texte.split(/\r?\n/).find(l => /description/i.test(l)) || texte.split(/\r?\n/)[0];
  const compte = c => premiere.split(c).length - 1;
  const sep = [",", ";", "\t"].sort((a, b) => compte(b) - compte(a))[0];
  const lignes = []; let ligne = [], champ = "", guill = false;
  for (let i = 0; i < texte.length; i++) {
    const ch = texte[i];
    if (guill) {
      if (ch === '"' && texte[i + 1] === '"') { champ += '"'; i++; }
      else if (ch === '"') guill = false;
      else champ += ch;
    } else if (ch === '"') guill = true;
    else if (ch === sep) { ligne.push(champ); champ = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && texte[i + 1] === "\n") i++;
      ligne.push(champ); lignes.push(ligne); ligne = []; champ = "";
    } else champ += ch;
  }
  if (champ || ligne.length) { ligne.push(champ); lignes.push(ligne); }
  return lignes.map(l => l.map(v => v === "" ? null : v));
}
function decoderTexte(buf) {
  const t = new TextDecoder("utf-8").decode(buf);
  return t.includes("\uFFFD") ? new TextDecoder("windows-1252").decode(buf) : t;
}
/* lit n'importe quel export : détecte le format au contenu, pas à l'extension */
async function lireTable(buf) {
  const u8 = new Uint8Array(buf);
  let table;
  if (u8[0] === 0x50 && u8[1] === 0x4b) table = await lireXlsx(buf);
  else if (u8[0] === 0xd0 && u8[1] === 0xcf && u8[2] === 0x11 && u8[3] === 0xe0)
    throw new Error("fichier Excel 97-2003 (.xls) non lisible ici. Ouvrez-le dans Excel et enregistrez-le au format .xlsx, ou exportez le relevé Degiro en .csv");
  else {
    const texte = decoderTexte(buf);
    table = /^\s*</.test(texte) ? lireHtml(texte) : lireCsv(texte);
  }
  const r = ligneEntete(table);
  if (r < 0) {
    const apercu = (table.find(l => l && l.some(v => v !== null)) || []).filter(v => v !== null).slice(0, 6).join(" | ");
    throw new Error("en-têtes Date / Description / Mouvements introuvables" + (apercu ? " (première ligne lue : « " + String(apercu).slice(0, 120) + " »)" : " (fichier vide ?)"));
  }
  return table.slice(r);
}
async function lireFichier(f) {
  $("etat").textContent = t("etatLecture", { f: f.name });
  $("etat").classList.remove("erreur");
  try {
    const buf = await f.arrayBuffer();
    const table = await lireTable(buf);
    charger(table, f.name, false);
  } catch (e) {
    $("etat").textContent = t("erreur", { m: motif(e.message) });
    $("etat").classList.add("erreur");
  }
}
